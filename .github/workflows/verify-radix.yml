name: Verify Radix touch-scroll repair on Linux
on:
  push:
    branches: [verify-radix-touch-ci]
permissions:
  contents: read
jobs:
  verify:
    name: PR ${{ matrix.pr }} upstream build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - pr: touch-scroll-repair
            sha: 1c2b009f1041a9ed23b402564a49b635f7ea7f2a
    steps:
      - uses: actions/checkout@v6
        with:
          repository: le700/primitives
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify exact source
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: ./.github/actions/ci-setup
      - run: pnpm exec oxfmt --check playwright.config.ts e2e/select.spec.ts
      - run: pnpm types:check
      - run: pnpm lint
      - run: node scripts/check-composed-refs.mjs
      - run: pnpm build:ci
      - run: pnpm test:ci
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: radix-${{ matrix.pr }}-browser-diagnostics
          path: |
            test-results/
            playwright-report/
